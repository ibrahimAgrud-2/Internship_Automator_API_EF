<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staj Başvurusu</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />

</head>
<body class="container py-4" style="max-width: 640px;">

    <h3 class="mb-4">Staj Başvuru Formu</h3>

    <form id="applyForm">

        <h5 class="mb-3">Kişisel Bilgiler</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">Ad</label>
                <input id="firstName" name="firstName" type="text" class="form-control" maxlength="20" required />
            </div>
            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Soyad</label>
                <input id="lastName" name="lastName" type="text" class="form-control" maxlength="20" required />
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-posta</label>
            <input id="email" name="email" type="email" class="form-control" maxlength="50" required />
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Telefon</label>
            <input id="phone" name="phone" type="tel" class="form-control" maxlength="20" required />
        </div>

        <div class="mb-4">
            <label for="address" class="form-label">Adres <span class="text-muted">(opsiyonel)</span></label>
            <textarea id="address" name="address" class="form-control" rows="2" maxlength="250"></textarea>
        </div>

        <h5 class="mb-3">Eğitim Bilgileri</h5>
        <div class="mb-3">
            <label for="university" class="form-label">Üniversite</label>
            <input id="university" name="university" type="text" class="form-control" maxlength="30" required />
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label for="department" class="form-label">Bölüm</label>
                <input id="department" name="department" type="text" class="form-control" maxlength="30" required />
            </div>
            <div class="col-md-4 mb-3">
                <label for="classYear" class="form-label">Sınıf</label>
                <select id="classYear" name="classYear" class="form-select" required>
                    <option value="" selected disabled>Seçiniz</option>
                    <option value="1">1. Sınıf</option>
                    <option value="2">2. Sınıf</option>
                    <option value="3">3. Sınıf</option>
                    <option value="4">4. Sınıf</option>
                </select>
            </div>
        </div>

        <h5 class="mt-3 mb-3">Bağlantılar <span class="text-muted fs-6">(opsiyonel)</span></h5>
        <div class="mb-3">
            <label for="linkedinUrl" class="form-label">LinkedIn</label>
            <input id="linkedinUrl" name="linkedinUrl" type="url" class="form-control" maxlength="50" />
        </div>
        <div class="mb-4">
            <label for="githubUrl" class="form-label">GitHub</label>
            <input id="githubUrl" name="githubUrl" type="url" class="form-control" maxlength="50" />
        </div>

        <button type="submit" class="btn btn-primary">Başvur</button>


        <div id="message" class="mt-3"></div>
    </form>
    <script src="/js/core/api.js?v=18"></script>
    <script src="/js/core/ui.js?v=18"></script>
    <script src="/js/apply/apply.js?v=18"></script>
</body>
</html>
