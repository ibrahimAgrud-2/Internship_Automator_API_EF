<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stajyerler</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/shell.css?v=33" />
    <link rel="stylesheet" href="/css/interns.css?v=33" />
</head>
<body class="shell">

    <header id="shellHeader"></header>

    <div class="shell-body">
        <nav id="shellSidebar"></nav>

        <main class="shell-content">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <h4 class="mb-0">Stajyerler</h4>

                <!-- Ad-soyad arama: yazdıkça listeyi süzer -->
                <div class="d-flex align-items-center gap-3">
                    <span id="resultCount" class="small text-muted"></span>
                    <div class="input-group intern-search">
                        <input type="search" id="searchInput" class="form-control"
                               placeholder="Ad Soyad ara..." aria-label="Stajyer ara"
                               autocomplete="off" disabled />
                        <button type="button" id="searchClear" class="btn btn-outline-secondary" disabled>Temizle</button>
                    </div>
                </div>
            </div>

            <!-- İşlem sonucu bildirimi (staj bitirildi...) -->
            <div id="noticeBox" class="alert" role="status" hidden></div>

            <!-- Yükleniyor / boş liste / hata mesajları -->
            <div id="statusBox" class="alert" hidden></div>

            <div id="internList" class="intern-grid"></div>
        </main>
    </div>

    <!-- Staj bitirme onay penceresi -->
    <div class="modal fade" id="separateModal" tabindex="-1" aria-labelledby="separateTitle"
         aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <form class="modal-content" id="separateForm" autocomplete="off">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="separateTitle">Stajı Bitir</h5>
                </div>
                <div class="modal-body">
                    <p id="separateSummary" class="fw-semibold"></p>
                    <ul>
                        <li>Stajyer <strong>ayrıldı</strong> durumuna geçer.</li>
                        <li>Stajyere yeni proje veya görev atanamaz.</li>
                        <li>Geçmiş proje ve görev kayıtları korunur.</li>
                        <li><strong>Bu işlem geri alınamaz.</strong></li>
                    </ul>

                    <label for="separateConfirm" class="form-label">
                        Onaylamak için stajyerin adını soyadını yazın:
                        <strong id="separateExpected"></strong>
                    </label>
                    <input type="text" id="separateConfirm" class="form-control" />

                    <div id="separateError" class="alert alert-danger mt-3" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="separateCancel" class="btn btn-secondary" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" id="separateSubmit" class="btn btn-danger" disabled>Stajı Bitir</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/core/auth.js?v=33"></script>
    <script src="/js/core/api.js?v=33"></script>
    <script src="/js/core/ui.js?v=33"></script>
    <script src="/js/core/shell.js?v=33"></script>
    <script src="/js/staff/interns.js?v=33"></script>
</body>
</html>
