<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesajlar</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/shell.css?v=32" />
    <link rel="stylesheet" href="/css/messages.css?v=32" />
</head>
<body class="shell">

    <header id="shellHeader"></header>

    <div class="shell-body">
        <nav id="shellSidebar"></nav>

        <main class="shell-content">
            <h4 class="mb-4">Mesajlar</h4>

            <div class="chat-layout card">

                <!-- Sol: sohbet listesi -->
                <aside class="chat-list-panel border-end">
                    <div class="p-3 border-bottom">
                        <button type="button" class="btn btn-outline-primary w-100" disabled>Yeni sohbet</button>
                    </div>

                    <div id="chatList" class="flex-grow-1 overflow-auto">
                        <!-- Ortak grup her zaman en üstte -->
                        <button type="button" class="chat-list-item active">
                            <span class="avatar-circle rounded-circle bg-success text-white d-flex align-items-center justify-content-center fw-semibold">SG</span>
                            <span class="chat-list-text">
                                <span class="d-flex justify-content-between gap-2">
                                    <span class="fw-semibold text-truncate">Stajyerler Ortak Grup</span>
                                    <span id="groupTime" class="small text-muted flex-shrink-0"></span>
                                </span>
                                <span id="groupPreview" class="chat-preview d-block small text-muted">&nbsp;</span>
                            </span>
                        </button>

                        <p class="text-muted small text-center p-3 mb-0">Henüz birebir sohbet yok.</p>
                    </div>
                </aside>

                <!-- Sağ: seçili sohbet -->
                <section class="chat-panel">
                    <div class="d-flex align-items-center gap-3 p-3 border-bottom">
                        <span class="avatar-circle rounded-circle bg-success text-white d-flex align-items-center justify-content-center fw-semibold">SG</span>
                        <div>
                            <div class="fw-semibold">Stajyerler Ortak Grup</div>
                            <div class="small text-muted">Tüm stajyerler ve personel</div>
                        </div>
                    </div>

                    <!-- Yükleniyor / boş / hata mesajı -->
                    <div id="chatStatus" class="alert m-3 mb-0" hidden></div>

                    <!-- Mesajlar JS ile doldurulur -->
                    <div id="messageList" class="chat-messages"></div>

                    <!-- Gönderme hatası -->
                    <div id="sendError" class="alert alert-danger m-3 mb-0" role="alert" hidden></div>

                    <!-- Mesaj yazma satırı -->
                    <form id="composerForm" class="chat-composer border-top" autocomplete="off" novalidate>
                        <div class="dropup">
                            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="dropdown"
                                    aria-expanded="false" aria-label="Ekle">
                                +
                            </button>
                            <ul class="dropdown-menu">
                                <li><button type="button" class="dropdown-item" disabled>Dosya seç</button></li>
                                <li><hr class="dropdown-divider" /></li>
                                <li><h6 class="dropdown-header">Referans ver</h6></li>
                                <li><button type="button" class="dropdown-item" disabled>Duyuru</button></li>
                                <li><button type="button" class="dropdown-item" disabled>Proje</button></li>
                            </ul>
                        </div>

                        <textarea id="messageInput" class="form-control" rows="2" placeholder="Mesajınızı yazın..." aria-label="Mesaj"></textarea>
                        <button type="submit" id="sendButton" class="btn btn-outline-primary" disabled>Gönder</button>
                    </form>

                
</div>
                </section>
            </div>
        </main>
    </div>

    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/core/auth.js?v=38"></script>
    <script src="/js/core/api.js?v=38"></script>
    <script src="/js/core/ui.js?v=38"></script>
    <script src="/js/core/shell.js?v=38"></script>
    <script src="/js/staff/messages.js?v=38"></script>
</body>
</html>
