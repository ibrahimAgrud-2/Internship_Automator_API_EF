<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projeler</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/shell.css?v=19" />
    <link rel="stylesheet" href="/css/interns.css?v=19" />
    <link rel="stylesheet" href="/css/projects.css?v=19" />
</head>
<body class="shell">

    <header id="shellHeader"></header>

    <div class="shell-body">
        <nav id="shellSidebar"></nav>

        <main class="shell-content">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <h4 class="mb-0">Projeler</h4>

                <div class="d-flex flex-wrap align-items-center gap-3">
                    <span id="resultCount" class="small text-muted"></span>
                    <div class="input-group intern-search">
                        <input type="search" id="searchInput" class="form-control"
                               placeholder="Proje adı ara..." aria-label="Proje ara"
                               autocomplete="off" disabled />
                        <button type="button" id="searchClear" class="btn btn-outline-secondary" disabled>Temizle</button>
                    </div>
                    <button type="button" id="addProjectButton" class="btn btn-outline-primary">Proje Ekle</button>
                </div>
            </div>
            <div id="noticeBox" class="alert" role="status" hidden></div>
            <!-- Yükleniyor / boş liste / hata mesajları -->
            <div id="statusBox" class="alert" hidden></div>

            <div id="projectList" class="project-grid"></div>
        </main>
    </div>

    <!-- Proje detay penceresi -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    projectModal
                    <h5 class="modal-title text-break" id="projectModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body">
                    <p id="projectModalDescription" class="text-break" style="white-space: pre-line"></p>
                    <div id="projectModalTechnologies" class="mb-3"></div>

                    <div class="small"><span class="text-muted">Oluşturan: </span><span id="projectModalCreator"></span></div>
                    <div class="small"><span class="text-muted">Atanan stajyer sayısı: </span><span id="projectModalCount"></span></div>

                    <div id="projectModalError" class="alert alert-danger mt-3" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteProjectModal" tabindex="-1" aria-labelledby="deleteProjectTitle"
         aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteProjectTitle">Projeyi Sil</h5>
                </div>
                <div class="modal-body">
                    <div id="deleteProjectError" class="alert" role="alert" hidden></div>
                    <p class="mb-2">
                        <strong id="deleteProjectName" class="text-break"></strong> projesi kalıcı olarak silinecek.
                    </p>
                    <p class="text-muted small mb-0">Bu işlem geri alınamaz.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" id="deleteProjectCancel" class="btn btn-secondary" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="button" id="deleteProjectConfirm" class="btn btn-danger">Projeyi Sil</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectTitle"
         aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="createProjectForm" novalidate autocomplete="off">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createProjectTitle">Yeni Proje</h5>
                    </div>
                    <div class="modal-body">
                        <div id="createProjectError" class="alert" role="alert" hidden></div>

                        <div class="mb-3">
                            <label for="projectTitleInput" class="form-label">Proje adı <span class="text-danger">*</span></label>
                            <input type="text" id="projectTitleInput" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="projectTechnologiesInput" class="form-label">Teknolojiler</label>
                            <input type="text" id="projectTechnologiesInput" class="form-control" placeholder="C#, EF Core, ASP.NET">
                            <div class="form-text">Virgülle ayırın.</div>
                        </div>

                        <div class="mb-0">
                            <label for="projectDescriptionInput" class="form-label">Açıklama</label>
                            <textarea id="projectDescriptionInput" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="createProjectCancel" class="btn btn-outline-secondary" data-bs-dismiss="modal">Vazgeç</button>
                        <button type="submit" id="createProjectSubmit" class="btn btn-primary">Projeyi Ekle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/core/auth.js?v=19"></script>
    <script src="/js/core/api.js?v=19"></script>
    <script src="/js/core/ui.js?v=19"></script>
    <script src="/js/core/shell.js?v=19"></script>
    <script src="/js/staff/projects.js?v=19"></script>
</body>
</html>
