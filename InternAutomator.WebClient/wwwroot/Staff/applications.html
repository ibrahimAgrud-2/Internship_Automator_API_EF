<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staj Başvuruları</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/shell.css?v=5" />
</head>
<body class="shell">

    <header id="shellHeader"></header>

    <div class="shell-body">
        <nav id="shellSidebar"></nav>

        <main class="shell-content">
            <h4 class="mb-4">Staj Başvuruları</h4>

            <!-- İşlem sonucu bildirimi (onaylandı, reddedildi...) -->
            <div id="noticeBox" class="alert" role="status" hidden></div>

            <!-- Yükleniyor / boş liste / hata mesajları -->
            <div id="statusBox" class="alert" hidden></div>

            <div id="tableWrapper" class="table-responsive" hidden>
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Ad Soyad</th>
                            <th>E-posta</th>
                            <th>Üniversite</th>
                            <th>Bölüm</th>
                            <th>Sınıf</th>
                            <th>Başvuru Tarihi</th>
                            <th>Bağlantılar</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Karar penceresi -->
    <div class="modal fade" id="decisionModal" tabindex="-1" aria-labelledby="decisionTitle"
         aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <form class="modal-content" id="decisionForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="decisionTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body">
                    <p id="decisionSummary"></p>

                    <label for="decisionNotes" class="form-label">Not</label>
                    <textarea id="decisionNotes" class="form-control" rows="3" maxlength="150" required></textarea>
                    <div class="form-text">Zorunlu, en fazla 150 karakter.</div>

                    <div id="decisionError" class="alert alert-danger mt-3" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" id="decisionSubmit" class="btn btn-primary">Onayla</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js?v=8"></script>
    <script src="/js/api.js?v=8"></script>
    <script src="/js/shell.js?v=8"></script>
    <script src="/js/applications.js?v=8"></script>
</body>
</html>
