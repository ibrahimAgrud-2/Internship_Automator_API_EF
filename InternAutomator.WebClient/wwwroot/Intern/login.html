<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stajyer Girişi</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
</head>
<body class="container py-5" style="max-width: 420px;">

    <h3 class="mb-4 text-center">Stajyer Girişi</h3>

    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">E-posta</label>
            <input id="email" type="email" class="form-control" autocomplete="username" required />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Şifre</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>

        <div id="message" class="mt-3"></div>
    </form>
    <script src="/js/core/auth.js?v=34"></script>
    <script src="/js/core/api.js?v=34"></script>
    <script src="/js/core/ui.js?v=34"></script>
    <script src="/js/Intern/intern-login.js?v=34"></script>
</body>
</html>
